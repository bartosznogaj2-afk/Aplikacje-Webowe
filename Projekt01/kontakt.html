<!doctype html>
<html lang="pl">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kontakt</title>
    <link rel="stylesheet" href="style1.css" />
  </head>
  <body>
    <header>
      <div class="header-container">
        <a href="index1.html" class="logo"> Nasza działalność</a>
        <nav>
          <ul>
            <li><a href="index1.html">Home</a></li>
            <li><a href="galeria.html">Galeria</a></li>
            <li><a href="kontakt.html">Kontakt</a></li>
          </ul>
        </nav>
        <div class="header-right">
          <div id="live-clock">00:00:00</div>
          <button class="theme-toggle" id="themeBtn">Ciemny</button>
        </div>
      </div>
    </header>
    <main>
      <div class="contact-container">
        <h2>Kontakt z nami</h2>
        <p style="color: var(--text-muted); margin-bottom: 1.5rem">
          Masz pytanie? Napisz do nas.
        </p>
        <div id="statusBox" class="status-box"></div>
        <form id="contactForm" novalidate>
          <div class="form-group">
            <label for="email">E-Mail *</label>
            <input
              type="text"
              id="email"
              class="form-control"
              placeholder="bartosznogaj2@gmail.com"
            />
            <div id="emailError" class="error-message">
              Wprowadź poprawny adres e-mail
            </div>
          </div>
          <div class="form-group">
            <label for="subject">Temat wiadomości *</label>
            <select id="subject" class="form-control">
              <option value="pytanie">Pytanie odnośnie asortymentu</option>
              <option value="zamowienie">Farby na zamówienie</option>
              <option value="program">Program lojalnościowy</option>
              <option value="inne">Inny temat</option>
            </select>
          </div>
          <div class="form-group">
            <label for="message">Wiadomość *</label>
            <textarea
              id="message"
              class="form-control"
              placeholder="Wpisz treść wiadomości (minimum 10 znaków)..."
            ></textarea>
            <div id="messageError" class="error-message">
              Wiadomośc musi zawierać minimum 10 znaków
            </div>
          </div>
          <input type="submit" value="Wyślij" class="btn" style="width: 100%" />
        </form>
      </div>
    </main>
    <footer>
      <p>&copy; 2026 StoFarb Włoszczowa. Autor: <span>Bartosz Nogaj</span></p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
