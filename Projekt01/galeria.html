<!doctype html>
<html lang="pl">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nasz sklep - Galeria</title>
    <link rel="stylesheet" href="style1.css" />
  </head>
  <body>
    <header>
      <div class="header-container">
        <a href="index1.html" class="logo">StoFarb Włoszczowa</a>
        <nav>
          <ul>
            <li><a href="index1.html">Home</a></li>
            <li><a href="galeria.html">Galeria</a></li>
            <li><a href="kontakt.html">Kontakt</a></li>
          </ul>
        </nav>
        <div class="header-right">
          <div id="live-clock">00:00:00</div>
          <button class="theme-toggle" id="themeBtn">Ciemny</button>
        </div>
      </div>
    </header>
    <main id="page-gallery" class="page-content">
      <div style="text-align: center; margin-bottom: 2rem">
        <h2>Galeria zdjęć i mediów</h2>
        <p style="color: var(--text-muted); margin-top: 0.5rem">
          Przegląd materiałów
        </p>
      </div>
      <div class="gallery-grid">
        <div class="gallery-item">
          <img src="obrazy/zdjecie1.jpg" alt="zdjecie1" />
        </div>
        <div class="gallery-item">
          <img src="obrazy/zdjecie2.jpg" alt="zdjecie2" />
        </div>
        <div class="gallery-item">
          <img src="obrazy/zdjecie3.jpg" alt="zdjecie3" />
        </div>
        <div class="gallery-item">
          <img src="obrazy/zdjecie4.jpg" alt="zdjecie4" />
        </div>
        <div class="gallery-item">
          <img src="obrazy/zdjecie5.jpg" alt="zdjecie5" />
        </div>
      </div>
      <section class="video-section">
        <h3>Materiał wideo</h3>
        <p
          style="
            color: var(--text-muted);
            margin-top: 0.5rem;
            margin-bottom: 1rem;
          "
        >
          Nagranie wideo
        </p>
        <div class="video-container">
          <video controls poster="okladka.jpg">
            <source src="film.mp4" type="video/mp4" />
          </video>
        </div>
      </section>
    </main>
    <footer>
      <p>&copy; 2026 StoFarb Włoszczowa. Autor: <span>Bartosz Nogaj</span></p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
